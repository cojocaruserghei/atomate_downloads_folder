[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "download-monitor"
version = "1.0.0"
description = "A safe, configurable monitor that organizes downloaded files by type."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Download Monitor Contributors" }]
keywords = ["downloads", "file-organizer", "automation", "monitor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

dependencies = ["watchdog>=6.0"]

[project.scripts]
download-monitor = "download_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/download_monitor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
